[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
sha2 = "0.10.8"
hex = "0.4.3"
clap = { version = "4.5.37", features = ["derive"] }
tempfile = "3.20.0"
regorus = { version = "=0.13.0" }
ruvector-core = { version = "=2.4.0", default-features = false, features = ["memory-only"] }
rvf-runtime = { version = "=0.3.2" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

