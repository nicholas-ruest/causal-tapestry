[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "Transitive through pinned RuVector 2.4.0; this is an unmaintained advisory, not a known vulnerability, and no compatible upstream release removes bincode 1.x." },
]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib", "ISC"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

