<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Causal Tapestry incident reconstruction</title><desc id="desc">Telemetry threads converge into causal evidence, governed remediation, and an RVF bundle.</desc>
<style>
.bg{fill:#09111f}.panel{fill:#111d31;stroke:#284466;stroke-width:2}.thread{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:12 10;animation:flow 5s linear infinite}.cyan{stroke:#5eead4}.amber{stroke:#fbbf24}.rose{stroke:#fb7185}.node{fill:#0f2942;stroke:#7dd3fc;stroke-width:2}.t{fill:#e6f4ff;font:600 18px system-ui}.s{fill:#9fb7cc;font:14px system-ui}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-88}}@keyframes pulse{50%{opacity:.55;transform:scale(.97)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" width="1200" height="360" rx="24"/>
