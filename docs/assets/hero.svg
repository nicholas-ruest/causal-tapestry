<path class="thread cyan" d="M300 180 C390 180 390 142 470 142"/><path class="thread amber" d="M300 220 C390 220 390 220 470 220"/><path class="thread rose" d="M300 260 C390 260 390 298 470 298"/>
<rect class="panel" x="470" y="115" width="260" height="185" rx="18"/><text class="t" x="502" y="151">Causal loom</text><text class="s" x="502" y="190">invariant ranking</text><text class="s" x="502" y="222">anytime-valid e-values</text><text class="s" x="502" y="254">RuVector analogues</text><text class="s" x="502" y="286">Regorus policy gate</text>
<path class="thread cyan" d="M730 205 C810 205 810 175 875 175"/><path class="thread amber" d="M730 245 C810 245 810 265 875 265"/>
