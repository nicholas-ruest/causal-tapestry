<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Causal Tapestry execution flow</title><desc id="desc">Six executable stages with evidence receipts between each boundary.</desc>
<style>.bg{fill:#071525}.card{fill:#10243c;stroke:#315678;stroke-width:2}.h{fill:#f4fbff;font:600 17px system-ui}.s{fill:#a8c0d6;font:13px system-ui}.edge{stroke:#67e8f9;stroke-width:3;fill:none}.dot{fill:#fbbf24;animation:travel 6s linear infinite}.r{animation:glow 3s ease-in-out infinite}@keyframes travel{0%{transform:translate(0,0)}16%{transform:translate(180px,0)}33%{transform:translate(360px,0)}50%{transform:translate(540px,0)}66%{transform:translate(720px,0)}83%{transform:translate(900px,0)}100%{transform:translate(0,0)}}@keyframes glow{50%{stroke:#fbbf24}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect class="bg" width="1200" height="420" rx="24"/><text class="h" x="52" y="52" style="font-size:25px">One investigation, six accountable boundaries</text>
<path class="edge" d="M120 210 H1080"/><circle class="dot" cx="120" cy="210" r="9"/>
<g class="r"><rect class="card" x="45" y="125" width="150" height="145" rx="15"/><text class="h" x="68" y="164">1 · Acquire</text><text class="s" x="68" y="194">OTel JSON</text><text class="s" x="68" y="217">limits + IDs</text><text class="s" x="68" y="240">fail closed</text></g>
<g class="r"><rect class="card" x="225" y="125" width="150" height="145" rx="15"/><text class="h" x="248" y="164">2 · Align</text><text class="s" x="248" y="194">clock median</text><text class="s" x="248" y="217">partial order</text><text class="s" x="248" y="240">topology</text></g>
<g class="r"><rect class="card" x="405" y="125" width="150" height="145" rx="15"/><text class="h" x="428" y="164">3 · Infer</text><text class="s" x="428" y="194">ICP stability</text><text class="s" x="428" y="217">e-process</text><text class="s" x="428" y="240">rank causes</text></g>
<g class="r"><rect class="card" x="585" y="125" width="150" height="145" rx="15"/><text class="h" x="608" y="164">4 · Recall</text><text class="s" x="608" y="194">8-D embedding</text><text class="s" x="608" y="217">RuVector</text><text class="s" x="608" y="240">prior outcomes</text></g>
<g class="r"><rect class="card" x="765" y="125" width="150" height="145" rx="15"/><text class="h" x="788" y="164">5 · Govern</text><text class="s" x="788" y="194">reversible plan</text><text class="s" x="788" y="217">Regorus</text><text class="s" x="788" y="240">bounded blast</text></g>
<g class="r"><rect class="card" x="945" y="125" width="210" height="145" rx="15"/><text class="h" x="968" y="164">6 · Seal + replay</text><text class="s" x="968" y="194">hash chain</text><text class="s" x="968" y="217">RVF write/readback</text><text class="s" x="968" y="240">portable evidence</text></g>
<text class="s" x="52" y="330">Every stage appends a deterministic receipt; remediation is proposed only and never executed.</text>
</svg>
